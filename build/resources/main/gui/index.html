<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IekeiClient GUI - Soar Style</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fontsから丸みのあるフォントを読み込む -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="gui-window">
        <!-- 左側のアイコンサイドバー -->
        <aside class="sidebar">
            <!-- ≡ メニューアイコン -->
            <div class="menu-icon">
                <svg viewBox="0 0 24 24">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </div>

            <!-- ホームアイコン (アクティブ) -->
<div class="nav-icon active" title="Home">
    <!-- fill="none"で塗りつぶしを消し、stroke関連で線を設定する -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
</div>

            <!-- ボックス（モジュール）アイコン -->
 <div class="nav-icon" title="Modules">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="5" x="2" y="3" rx="1"/>
        <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
        <path d="M10 12h4"/>
    </svg>
</div>

            <!-- ショップ（バッグ）アイコン -->
<div class="nav-icon" title="Mirror">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 6 8 9"/>
        <path d="m16 7-8 8"/>
        <rect x="4" y="2" width="16" height="20" rx="2"/>
    </svg>
</div>

            <!-- ミュージックアイコン -->
<div class="nav-icon" title="Music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V3a1 1 0 0 0-1.28-.96l-10 2.917a1 1 0 0 0-.72.96V19"/>
        <circle cx="18" cy="16" r="3"/>
        <circle cx="6" cy="19" r="3"/>
    </svg>
</div>

            <!-- 編集（ペン）アイコン -->
 <div class="nav-icon" title="Edit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>
    </svg>
</div>

            <!-- 設定（歯車）アイコン -->
<div class="nav-icon" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>
</div>
        </aside>

        <!-- 右側のメインコンテンツ -->
        <main class="main-area">
            <!-- ヘッダー -->
            <header class="header">
                <h2>Home</h2>
            </header>

            <!-- スクロール可能なコンテンツエリア -->
            <div class="content">
                
                <!-- Welcomeカード -->
                <div class="card welcome-card">
                    <h3>Welcome to Iekei Client</h3>
                    <div class="profile">
                        <img src="https://minotar.net/helm/MHF_Steve/40.png" alt="Skin" class="skin-head">
                        <span class="player-name">PlayerName</span>
                    </div>
                </div>

                <!-- モジュール設定カード（ここをタブで切り替える想定） -->
                <div class="card modules-card">
                    <div class="module-row">
                        <span class="module-name">KillAura</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="killaura" onchange="toggleModule('KillAura', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    
                    <div class="module-row">
                        <span class="module-name">AutoArmor</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="autoarmor" onchange="toggleModule('AutoArmor', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="module-row">
                        <span class="module-name">Sprint</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="sprint" checked onchange="toggleModule('Sprint', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <!-- Discordカード風 -->
                <div class="card discord-card">
                    <div class="discord-content">
                        <h3>Join Our Discord</h3>
                        <p>To get support and talk!</p>
                    </div>
                    <button class="join-btn">Join ></button>
                </div>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
