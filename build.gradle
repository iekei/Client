buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.10.0'
    }
}

plugins {
	id 'fabric-loom' version '1.19-SNAPSHOT'
}

project.ext.lwjglVersion = "3.3.3"
version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/iekei.accesswidener")
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
           maven { url 'https://maven.meteordev.org/releases' }
           maven { url 'https://maven.meteordev.org/snapshots' }
	maven { url "https://api.modrinth.com/maven" }
	maven { url "https://maven.lenni0451.net/everything" }
	maven { url "https://repo.viaversion.com/" }
	maven { url "https://repo.opencollab.dev/maven-snapshots/" }
	maven { url "https://maven.terraformersmc.com/" }
}

configurations {
    jij
	modJij
	include.extendsFrom modJij
    modImplementation.extendsFrom modJij
    modCompileOnlyApi.extendsFrom modJij
	proguard
}

dependencies {

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "com.viaversion:viafabricplus-api:4.4.15"

	modRuntimeOnly "maven.modrinth:sodium:mc1.21.11-0.8.14-fabric"
	modRuntimeOnly "maven.modrinth:iris:1.10.8+1.21.11-fabric"
	modRuntimeOnly "maven.modrinth:sodium-extra:mc1.21.11-0.9.5+fabric"
	modRuntimeOnly "maven.modrinth:lithium:mc1.21.11-0.21.4-fabric"
	modRuntimeOnly "maven.modrinth:in-game-account-switcher:9.0.8+1.21.11-fabric"
	modRuntimeOnly "com.viaversion:viafabricplus:4.4.15"
	modRuntimeOnly "maven.modrinth:immediatelyfast:1.14.3+1.21.11-fabric"
	modRuntimeOnly "maven.modrinth:entityculling:CTabrwB1"

    modCompileOnly "maven.modrinth:sodium:mc1.21.11-0.8.14-fabric"
    modCompileOnly "maven.modrinth:iris:1.10.8+1.21.11-fabric"
    modCompileOnly "maven.modrinth:lithium:mc1.21.11-0.21.4-fabric"
    modCompileOnly "meteordevelopment:baritone:1.21.10-SNAPSHOT"
    modCompileOnly "com.terraformersmc:modmenu:15.0.0"
    modCompileOnly "com.viaversion:viafabricplus:4.4.15"

	jij 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	jij 'io.github.humbleui:types:0.2.0'
	jij 'io.github.humbleui:skija-windows-x64:0.116.4'
	jij 'io.github.humbleui:skija-linux-x64:0.116.4'
	jij 'io.github.humbleui:skija-macos-x64:0.116.4'
	jij 'io.github.humbleui:skija-macos-arm64:0.116.4'
	jij 'com.kohlschutter.junixsocket:junixsocket-common:2.10.1'
	jij 'org.java-websocket:Java-WebSocket:1.6.0'
	jij "net.lenni0451:MCPing:1.4.2"
	jij "net.lenni0451:Reflect:1.4.0"
	
	modJij 'com.github.CCBlueX:mcef:3.3.0-1.21.11'
    jij 'meteordevelopment:orbit:0.2.4'
    jij 'org.meteordev:starscript:0.2.5'
    jij 'meteordevelopment:discord-ipc:1.1'
    jij 'org.reflections:reflections:0.10.2'
    jij('io.netty:netty-handler-proxy:4.2.7.Final') { transitive = false }
    jij('io.netty:netty-codec-socks:4.2.7.Final') { transitive = false }
    jij 'de.florianmichael:WaybackAuthLib:1.0.1'
    jij 'net.raphimc:MinecraftAuth:5.0.2'

	proguard 'com.guardsquare:proguard-base:7.10.0'

    def lwjglNfdDeps = [
        "org.lwjgl:lwjgl-nfd:$lwjglVersion",
        "org.lwjgl:lwjgl-nfd::natives-linux",
        "org.lwjgl:lwjgl-nfd::natives-macos",
        "org.lwjgl:lwjgl-nfd::natives-macos-arm64",
        "org.lwjgl:lwjgl-nfd::natives-windows"
    ]
    
    // Add LWJGL NFD dependencies to both jij and implementation
    lwjglNfdDeps.each { dep ->
        jij dep
        implementation dep
        include dep
    }
	
	afterEvaluate {
        configurations.jij.incoming.resolutionResult.allDependencies.each {
            dependencies.include(dependencies.implementation(dependencies.compileOnlyApi(it.requested.toString()) {
                transitive = false
            }))
        }
    }
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

task proguard(type: proguard.gradle.ProGuardTask) {
    dependsOn jar
    injars jar.archiveFile
    outjars "build/libs/${project.archives_base_name}-${version}-proguarded.jar"
    
    fileTree("${System.properties['java.home']}\\jmods\\") {
        forEach() {
            libraryjars "${it.path}"
        }
    }

    libraryjars configurations.compileClasspath
    
    dontwarn '**'

    keepattributes 'Signature,*Annotation*,Exceptions'
    
    keep 'class com.iekeiclient.mixin.mixins** { *; }'
    keeppackagenames 'com.iekeiclient.mixin.mixins**'
    keep 'class com.iekeiclient.engine.mixin.** { *; }'
    keeppackagenames 'com.iekeiclient.engine.mixin.**'
    keeppackagenames 'com.iekeiclient.engine.**'
    keep 'class com.iekeiclient.engine.IekeiClient { *; }'
    keep 'class com.iekeiclient.engine.MixinPlugin { *; }'
    keep 'class com.iekeiclient.engine.modintegration.ModMenuIntegration { *; }'
    
    renamesourcefileattribute 'SourceFile'
    repackageclasses ''
    
    useuniqueclassmembernames
    dontusemixedcaseclassnames
    dontoptimize
    dontshrink
}

remapJar {
    dependsOn proguard
    input = file("build/libs/${project.archives_base_name}-${version}-proguarded.jar")
}